apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

/**
 * Set true if you want Proguard/R8 minification for release.
 */
def enableProguardInReleaseBuilds = false

/**
 * Release Keystore Configuration
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

/**
 * JavaScriptCore
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.chatbots"

    lint {
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.mindcrawller.humaeli"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // Google Play update version
        versionCode 6
        versionName "1.0.5"

        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }

    signingConfigs {

        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {

        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }

        release {
            signingConfig signingConfigs.release
            manifestPlaceholders = [usesCleartextTraffic: "false"]

            minifyEnabled enableProguardInReleaseBuilds

            proguardFiles(
                getDefaultProguardFile("proguard-android.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

/**
 * Exclude old Android Support libraries that conflict with AndroidX.
 */
configurations.all {

    exclude group: "com.android.support", module: "support-compat"
    exclude group: "com.android.support", module: "support-annotations"
    exclude group: "com.android.support", module: "support-core-utils"
    exclude group: "com.android.support", module: "support-core-ui"
    exclude group: "com.android.support", module: "support-fragment"
    exclude group: "com.android.support", module: "appcompat-v7"
    exclude group: "com.android.support", module: "animated-vector-drawable"
    exclude group: "com.android.support", module: "support-vector-drawable"
    exclude group: "com.android.support", module: "versionedparcelable"

    resolutionStrategy {
        force "androidx.core:core:1.13.0"
        force "androidx.core:core-ktx:1.13.0"
    }
}

dependencies {

    // React Native
    implementation("com.facebook.react:react-android")

    // InCall Manager
    implementation project(":react-native-incall-manager")

    // Hermes / JSC
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * React Native Vector Icons
 */
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
